spring:
  # NOTE: no default `spring.profiles.active` here on purpose. The base config
  # must NOT auto-activate the h2 profile, otherwise a production run that
  # forgets SPRING_PROFILES_ACTIVE silently boots against a local H2 file DB
  # (ddl-auto=update, Flyway off, demo data seeded). Activate a profile
  # explicitly instead: `--spring.profiles.active=h2` (local H2) or the
  # `dev`/`prod` profile for PostgreSQL deployments.
  application:
    name: timetable-scheduler-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timetable_db}
    username: ${SPRING_DATASOURCE_USERNAME:timetable_user}
    password: ${SPRING_DATASOURCE_PASSWORD:timetable_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TimetableHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Must stay false: on a NON-EMPTY schema, baseline-on-migrate=true makes Flyway
    # insert a BASELINE marker at version 1 and SKIP V1 entirely. V2 then fails with
    # `relation "faculty" does not exist` because V2's FKs reference V1-only tables.
    # V1.1__ensure_core_tables.sql exists only to REPAIR databases already baselined
    # at V1 by the previous setting; it is not a substitute for running V1.
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

timetable:
  scheduler:
    # Scheduling engine implementation, registered behind the same ScheduleEngine interface.
    #   greedy  -> deterministic rule-based TimetableGeneratorEngine (default)
    #   timefold -> Timefold solver (TimefoldScheduleEngine); also activates the
    #               Timefold solver stack (SolverFactory/SolverManager/SolutionManager).
    engine: greedy
    # Practical periods (practicalHours of any subject, independent of its type)
    # are grouped into consecutive blocks of this many periods per session.
    # Live curriculum uses 2 (CS142/CS795/CS850 each carry 2 practical hours).
    practical-block-size: 2
  solver:
    # Timefold termination tuning (used when engine=timefold). The engine scales
    # these down per problem: it stops as soon as a feasible solution is found
    # (bestScoreFeasible), and its spent/unimproved safety nets grow with lesson
    # count up to these caps — so small timetables finish in a second or two.
    termination:
      seconds: 15            # hard spent-limit cap
      unimproved-seconds: 3  # stop shortly after the best score stops improving

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 5MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true

logging:
  level:
    com.erp.timetable: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
